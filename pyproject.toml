[project]
name = "vehicle-mcp"
version = "0.2.0"
description = "Read-only Model Context Protocol server for the vehicle-platform telemetry API."
readme = "README.md"
authors = [{ name = "vehicle-platform" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
vehicle-mcp = "vehicle_mcp.server:main"
vehicle-mcp-index = "vehicle_mcp.knowledge.indexer:cli"

[project.optional-dependencies]
rag = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pypdf>=5",
    "sqlite-vec>=0.1.6",
    "tokenizers>=0.20",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

extend-exclude = ["src/vehicle_mcp/_position_vendored.py"]  # generated, vendored unchanged

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "position_vectors: the defs position-rule golden vectors (T22)",
    "slow: needs the real embedding model (run with --run-slow after fetch-model)",
    "fuzz: Hypothesis properties (bounded in PR CI; HYPOTHESIS_PROFILE=deep for the deep run)",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
max-args = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "sqlite_vec", "pypdf"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Ratchet floor: measured branch coverage rounded down; raise when main is >= 3 points above.
fail_under = 91
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
